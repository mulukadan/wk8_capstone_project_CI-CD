name: AfyaPlus Week 8 CI/CD

on:
  pull_request:

  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  # =====================================================
  # JOB 1
  # LINT + TEST
  # =====================================================

  lint_test:

    name: Lint and Test

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python syntax check
        run: |
          python -m compileall .

      - name: Check prompt pin
        run: |
          python check_prompt_pin.py

      - name: Run tests
        run: |
          pytest -v


  # =====================================================
  # JOB 2
  # EVALUATION GATE
  # =====================================================

  eval:

    name: Golden Set Eval

    runs-on: ubuntu-latest

    needs:
      - lint_test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run regression gate
        run: |
          python eval_prompts.py


  # =====================================================
  # JOB 3
  # MCP HEALTH GATE
  # =====================================================

  mcp_health:

    name: MCP Health

    runs-on: ubuntu-latest

    needs:
      - eval

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check MCP health
        run: |
          python scripts/check_mcp_health.py


  # =====================================================
  # JOB 4
  # BUILD + DEPLOY STUB
  # =====================================================

  build_deploy:

    name: Build and Deploy Stub

    runs-on: ubuntu-latest

    needs:
      - mcp_health

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t afyaplus-week8:v1.2.0 \
            -t afyaplus-week8:${{ github.sha }} \
            .

      - name: Record image identity
        run: |
          echo "Release image:"
          echo "afyaplus-week8:v1.2.0"

          echo "Commit image:"
          echo "afyaplus-week8:${{ github.sha }}"

          docker inspect \
            afyaplus-week8:v1.2.0 \
            --format='{{index .RepoDigests 0}}' \
            || true

      - name: Deploy stub
        run: |
          echo "DEPLOYMENT STUB"
          echo "All gates passed."
          echo "The image is approved for deployment."
          echo "No paid cloud deployment is used in this capstone."